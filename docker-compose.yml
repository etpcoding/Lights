services:
  lumennet:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumennet-console
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
      - "6454:6454/udp"
    # On Linux hosts, if you need global/subnet Art-Net UDP broadcast (e.g. 255.255.255.255)
    # to reach physical lighting nodes on your LAN, comment out the `ports:` block above
    # and uncomment `network_mode: host`:
    # network_mode: host
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
